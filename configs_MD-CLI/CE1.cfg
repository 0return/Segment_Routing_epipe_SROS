configure {
       port 1/1/c1/1 {
            admin-state enable
            ethernet {
                encap-type dot1q
            }
        }
        router "Base" {
            interface "toPE1-100" {
                admin-state enable
                port 1/1/c1/1:100
                ipv4 {
                    primary {
                        address 172.16.100.1
                        prefix-length 24
                    }
                }
            }
        }
