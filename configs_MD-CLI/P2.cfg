# P2 - Transit node (IS-IS L1/L2), SR-ISIS only
# MD-CLI: paste inside "edit-config private", then "commit"

/configure system name "P2"

# Network port toward P1
/configure port 1/1/c1 {
    admin-state enable
    connector { breakout c1-100g }
}
/configure port 1/1/c1/1 { admin-state enable }

# Network port toward PE2
/configure port 1/1/c2 {
    admin-state enable
    connector { breakout c1-100g }
}
/configure port 1/1/c2/1 { admin-state enable }

# Interfaces, SRGB and IS-IS L1/L2 with Segment Routing
/configure router "Base" {
    interface "system" {
        ipv4 { primary { address 100.0.1.2 prefix-length 32 } }
    }
    interface "to-P1" {
        port 1/1/c1/1
        ipv4 { primary { address 192.168.1.2 prefix-length 30 } }
    }
    interface "to-PE2" {
        port 1/1/c2/1
        ipv4 { primary { address 10.0.1.1 prefix-length 30 } }
    }
    mpls-labels {
        sr-labels { start 100000 end 100999 }
    }
    isis 0 {
        admin-state enable
        advertise-router-capability as
        level-capability 1/2
        area-address [49.0001]
        segment-routing {
            admin-state enable
            prefix-sid-range { global }
        }
        interface "system" { ipv4-node-sid { index 12 } }
        interface "to-P1" { interface-type point-to-point }
        interface "to-PE2" { interface-type point-to-point }
        level 1 { wide-metrics-only true }
        level 2 { wide-metrics-only true }
    }
}
