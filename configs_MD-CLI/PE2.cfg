# PE2 - Provider edge (IS-IS L1), Epipe 100 over SR-ISIS
# MD-CLI: paste inside "edit-config private", then "commit"

/configure system name "PE2"

# Access port toward CE2
/configure port 1/1/c1 {
    admin-state enable
    connector { breakout c1-100g }
}
/configure port 1/1/c1/1 {
    admin-state enable
    ethernet {
        mode access
        encap-type dot1q
    }
}

# Network port toward P2
/configure port 1/1/c2 {
    admin-state enable
    connector { breakout c1-100g }
}
/configure port 1/1/c2/1 { admin-state enable }

# Interfaces, SRGB and IS-IS L1 with Segment Routing
/configure router "Base" {
    interface "system" {
        ipv4 { primary { address 2.2.2.2 prefix-length 32 } }
    }
    interface "to-P2" {
        port 1/1/c2/1
        ipv4 { primary { address 10.0.1.2 prefix-length 30 } }
    }
    mpls-labels {
        sr-labels { start 100000 end 100999 }
    }
    isis 0 {
        admin-state enable
        advertise-router-capability as
        level-capability 1
        area-address [49.0001]
        segment-routing {
            admin-state enable
            prefix-sid-range { global }
        }
        interface "system" { ipv4-node-sid { index 2 } }
        interface "to-P2" { interface-type point-to-point }
        level 1 { wide-metrics-only true }
    }
}

# T-LDP only, to signal the VC label (no LDP on links)
/configure router "Base" ldp { admin-state enable }

# SDP over SR-ISIS toward PE1 and Epipe 100
/configure service {
    sdp 8 {
        admin-state enable
        delivery-type mpls
        sr-isis true
        far-end { ip-address 1.1.1.1 }
    }
    epipe "EPIPE-100" {
        admin-state enable
        service-id 100
        customer "1"
        sap 1/1/c1/1:100 { }
        spoke-sdp 8:100 { }
    }
}
