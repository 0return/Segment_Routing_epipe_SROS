# PE1 - Provider edge (IS-IS L1), Epipe 100 over SR-ISIS
# Classic CLI: paste at the root prompt, then "admin save"

exit all
configure
    system
        name "PE1"
    exit
#--------------------------------------------------
# Access port toward CE1 / network port toward P1
#--------------------------------------------------
    port 1/1/c1
        connector
            breakout c1-100g
        exit
        no shutdown
    exit
    port 1/1/c1/1
        ethernet
            mode access
            encap-type dot1q
        exit
        no shutdown
    exit
    port 1/1/c2
        connector
            breakout c1-100g
        exit
        no shutdown
    exit
    port 1/1/c2/1
        no shutdown
    exit
#--------------------------------------------------
# Interfaces, SRGB, IS-IS L1 + SR, T-LDP
#--------------------------------------------------
    router Base
        interface "system"
            address 1.1.1.1/32
            no shutdown
        exit
        interface "to-P1"
            address 10.0.0.1/30
            port 1/1/c2/1
            no shutdown
        exit
        mpls-labels
            sr-labels start 100000 end 100999
        exit
        isis 0
            level-capability level-1
            area-id 49.0001
            advertise-router-capability as
            level 1
                wide-metrics-only
            exit
            segment-routing
                prefix-sid-range global
                no shutdown
            exit
            interface "system"
                ipv4-node-sid index 1
                no shutdown
            exit
            interface "to-P1"
                interface-type point-to-point
                no shutdown
            exit
            no shutdown
        exit
        ldp
            no shutdown
        exit
    exit
#--------------------------------------------------
# SDP over SR-ISIS toward PE2 and Epipe 100
#--------------------------------------------------
    service
        sdp 4 mpls create
            far-end 2.2.2.2
            sr-isis
            no shutdown
        exit
        epipe 100 name "EPIPE-100" customer 1 create
            sap 1/1/c1/1:100 create
                no shutdown
            exit
            spoke-sdp 4:100 create
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all
