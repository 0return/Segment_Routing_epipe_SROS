# P1 - Transit node (IS-IS L1/L2), SR-ISIS only
# Classic CLI: paste at the root prompt, then "admin save"

exit all
configure
    system
        name "P1"
    exit
#--------------------------------------------------
# Network ports toward PE1 and P2
#--------------------------------------------------
    port 1/1/c1
        connector
            breakout c1-100g
        exit
        no shutdown
    exit
    port 1/1/c1/1
        no shutdown
    exit
    port 1/1/c2
        connector
            breakout c1-100g
        exit
        no shutdown
    exit
    port 1/1/c2/1
        no shutdown
    exit
#--------------------------------------------------
# Interfaces, SRGB, IS-IS L1/L2 + SR
#--------------------------------------------------
    router Base
        interface "system"
            address 100.0.1.1/32
            no shutdown
        exit
        interface "to-PE1"
            address 10.0.0.2/30
            port 1/1/c1/1
            no shutdown
        exit
        interface "to-P2"
            address 192.168.1.1/30
            port 1/1/c2/1
            no shutdown
        exit
        mpls-labels
            sr-labels start 100000 end 100999
        exit
        isis 0
            level-capability level-1/2
            area-id 49.0001
            advertise-router-capability as
            level 1
                wide-metrics-only
            exit
            level 2
                wide-metrics-only
            exit
            segment-routing
                prefix-sid-range global
                no shutdown
            exit
            interface "system"
                ipv4-node-sid index 11
                no shutdown
            exit
            interface "to-PE1"
                interface-type point-to-point
                no shutdown
            exit
            interface "to-P2"
                interface-type point-to-point
                no shutdown
            exit
            no shutdown
        exit
    exit
exit all
